<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Memotest - Aves de Argentina</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
            <style>
        /* Pantalla de selección de modo (Menú Inicial) */
        .pantalla-modo {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1e3c72;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99;
            color: white;
            font-family: sans-serif;
        }
        .btn-modo {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #4caf50;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .btn-modo:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        /* Créditos estables abajo en el menú azul */
        .creditos-menu {
            position: absolute;
            bottom: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.7); 
            font-size: 12px;
            line-height: 1.5;
            font-family: sans-serif;
            pointer-events: none; 
        }

        /* 📱 RESPONSIVE PARA EL TABLERO Y EL ZOOM EN MODO HORIZONTAL (COSTADO) */
        @media (orientation: landscape) {
            h1 { font-size: 1rem !important; margin: 2px 0 !important; text-align: center; }
            .marcador { padding: 4px 8px !important; margin-bottom: 2px !important; gap: 5px; }
            .jugador { font-size: 12px !important; margin: 0 4px !important; }
            .btn-reiniciar { padding: 4px 10px !important; font-size: 12px !important; }
            
            /* Tablero ajustado y despegado del score */
            .tablero {
                display: grid !important;
                grid-template-columns: repeat(8, minmax(0, 1fr)) !important; 
                gap: 6px !important; width: 100% !important; max-width: 650px !important; 
                margin: 10px auto 0 auto !important; 
                padding-left: calc(env(safe-area-inset-left) + 10px) !important;
                padding-right: calc(env(safe-area-inset-right) + 10px) !important;
                max-height: 65dvh !important; box-sizing: border-box !important;
            }

            /* Cartas del tablero más grandes y puras fotos */
                        /* 🃏 CARTAS DEL TABLERO EN HORIZONTAL: Imagen fija y protegida */
                        /* 🃏 CARTAS DEL TABLERO EN HORIZONTAL: Contenedor base */
                        /* 🃏 CARTAS DEL TABLERO EN HORIZONTAL: Contenedor base plano */
            .carta { 
                height: calc((65dvh - (6px * 4)) / 5) !important; 
                width: auto !important; 
                aspect-ratio: 3 / 4 !important; 
                margin: 0 auto !important;
                overflow: hidden !important;
                position: relative !important;
                /* Desactivamos cualquier efecto 3D del CSS viejo que maree al celular de costado */
                transform-style: flat !important;
                perspective: none !important;
            }

            /* ❌ SI LA CARTA ESTÁ VOLTEADA O ACERTADA: Apagamos el signo de pregunta por completo */
            .carta.volteada .reverso,
            .carta.acertada .reverso,
            .carta.ampliada-temporal .reverso {
                display: none !important;
                visibility: hidden !important;
                opacity: 0 !important;
            }

            /* 🔓 FORZAMOS LA VISIBILIDAD DE LA FOTO: Sin giros 3D de cabeza */
            .carta.volteada .frente,
            .carta.acertada .frente,
            .carta.ampliada-temporal .frente {
                display: flex !important;
                visibility: visible !important;
                opacity: 1 !important;
                width: 100% !important;
                height: 100% !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                /* 🔥 TRUCO MAESTRO: Anula el rotateY(180deg) de tu style.css que te mostraba el reverso invertido */
                transform: none !important; 
            }

            /* 📸 LA FOTO SE QUEDA FIJA: Llena toda la carta y se muestra al derecho */
                        /* 📸 LA FOTO SE QUEDA FIJA: Llena toda la carta y se corrige el efecto espejo */
                        /* 📸 FOTO BASE (Cuando ya acertaste y se queda fija en el tablero) */
                        /* 📸 FOTO COMPLETA EN HORIZONTAL: Candado de espejo universal para todo el proceso */
                        /* 📸 FOTO INTERACTIVA: Se aplica el espejo común mientras jugás y elegís las cartas */
                        /* 📸 FOTO INTERACTIVA: Se aplica el espejo mientras jugás y elegís las cartas */
                        /* 📸 FOTO INTERACTIVA EN SELECCIÓN: Aplica el espejo SOLAMENTE en las cartas activas */
            .carta.volteada img,
            .carta.ampliada-temporal img { 
                display: block !important;
                width: 100% !important; 
                height: 100% !important; 
                object-fit: cover !important; 
                border-radius: 4px !important;
                visibility: visible !important;
                opacity: 1 !important;
                /* 🔥 Contra-giro exclusivo para la etapa de volteo */
                transform: scaleX(-1) !important; 
            }

            /* 📸 FOTO FIJA EN ACIERTO: Se queda derecha y normal tanto en Celu como en PC */
            .carta img,
            .carta.acertada img {
                display: block !important;
                width: 100% !important; 
                height: 100% !important; 
                object-fit: cover !important; 
                border-radius: 4px !important;
                visibility: visible !important;
                opacity: 1 !important;
                /* Anulamos cualquier espejo para que en la PC y Celu quede al derecho al ganar el punto */
                transform: none !important; 
                scale: 1 1 !important;
            }

            /* Enderezamos la cara contenedora al acertar (Mantenemos tu éxito del celu) */
            .carta.acertada .frente,
            .tablero .carta.acertada .cara.frente {
                transform: none !important;
                scale: 1 1 !important;
            }

            /* Ocultamos las letras rotas del tablero achicándolas a cero */
            .carta span, 
            .carta .frente span { 
                display: block !important;
                position: absolute !important;
                width: 0 !important; height: 0 !important;
                overflow: hidden !important;
                font-size: 0 !important; 
                opacity: 0 !important;
                pointer-events: none !important;
            }



    
            /* El zoom flotante real en horizontal */
            div#zoomOverlay.zoom-overlay {
                display: none !important; 
            }
            div#zoomOverlay.zoom-overlay.activo {
                display: flex !important;
                position: fixed !important;
                top: 0 !important; left: 0 !important;
                width: 100vw !important; height: 100dvh !important;
                background: rgba(0, 0, 0, 0.6) !important; 
                z-index: 9999999 !important;
                justify-content: center !important; align-items: center !important;
                padding: 0 !important; margin: 0 !important;
                transform: none !important;
            }
            div#zoomOverlay.zoom-overlay.activo .zoom-card {
                display: flex !important; flex-direction: column !important;
                align-items: center !important; justify-content: flex-start !important;
                height: 86dvh !important; width: auto !important; aspect-ratio: 3 / 4 !important; 
                background: #ffffff !important; border-radius: 12px !important;
                padding: 6px !important; margin: 0 auto !important; box-sizing: border-box !important;
                overflow: hidden !important; position: relative !important;
                top: auto !important; left: auto !important; transform: none !important;
                border: 4px solid transparent !important;
                box-shadow: 0 15px 40px rgba(0,0,0,0.5) !important;
            }
            img#zoomImg {
                display: block !important;
                width: 100% !important; height: 76% !important; 
                min-height: 76% !important; max-height: 76% !important;
                max-height: calc(86dvh - 35px) !important; 
                object-fit: cover !important; border-radius: 8px !important;
                margin: 0 0 4px 0 !important; padding: 0 !important; position: relative !important;
            }
            h2#zoomTexto {
                display: flex !important; width: 100% !important; height: 20px !important; 
                margin-top: auto !important; margin-bottom: 2px !important;
                font-size: 13px !important; 
                font-weight: 900 !important; /* Letra más gruesa/negrita */
                color: #000000 !important;
                font-family: sans-serif !important; align-items: center !important; 
                justify-content: center !important; text-align: center !important;
                padding: 0 4px !important; box-sizing: border-box !important;
                white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important;
            }

            /* Borde de acierto de pareja */
            div#zoomOverlay.zoom-overlay.activo.acierto-pareja .zoom-card,
            div#zoomOverlay.acierto-pareja .zoom-card,
            .zoom-overlay.acierto-pareja .zoom-card {
                border: 4px solid #ffeb3b !important; 
                box-shadow: 0 0 30px rgba(255, 235, 59, 0.9) !important; 
            }
        }
        
    .carta {
    user-select: none;
    -webkit-user-select: none; /* Para que también ande en iPhones y Safari */
}  
    </style>

</head>

<body>

    <h1>Memotest: Aves de Argentina</h1>

    <!-- PANTALLA DE SELECCIÓN DE MODO -->
    <div id="pantalla-modo" class="pantalla-modo" style="display: flex; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #1e3c72; z-index: 99999; justify-content: center; align-items: center; flex-direction: column;">
    <h2 style="color: white; font-family: sans-serif; margin-bottom: 20px;">¿Cómo querés jugar hoy?</h2>
    <button id="btn-1jugador" class="btn-modo">👤 1 Jugador</button>
    <button id="btn-2jugadores" class="btn-modo">👥 2 Jugadores</button>

    <!-- Se agregó style="..." para posicionarlo abajo con espacio -->
    <p class="creditos-menu" style="position: absolute; bottom: 100px; left: 0; width: 100%; text-align: center; color: rgba(255,255,255,0.85); font-family: sans-serif; font-size: 0.75rem; line-height: 1.4; margin: 0; padding: 0 15px; z-index: 999999; pointer-events: none; box-sizing: border-box;">
    © Joaquín Luis Navarro - Imágenes creadas por IA<br>
    Efectos de sonido por Matthew Vakalyuk y Ken Williams de Pixabay
</p>



</div>


    <!-- Marcador -->
    <div class="marcador">
        <div id="puntos-j1" class="jugador">Jugador 1: <span id="score1">0</span></div>
        <div id="cont-tiempo" class="jugador" style="display: none;">⏱️ Tiempo: <span id="txt-tiempo">00:00</span></div>
        <button id="btn-reiniciar" class="btn-reiniciar">Reiniciar</button>
        <div id="puntos-j2" class="jugador">Jugador 2: <span id="score2">0</span></div>
        <div id="cont-intentos" class="jugador" style="display: none;">🔢 Intentos: <span id="txt-intentos">0</span></div>
    </div>

    <!-- Tablero -->
    <div class="tablero" id="tablero"></div>

    <!-- Capa de Zoom -->
    <div class="zoom-overlay" id="zoomOverlay">
        <div class="zoom-card">
            <img id="zoomImg" src="" alt="Animal">
            <h2 id="zoomTexto">Nombre</h2>
        </div>
    </div>

    <!-- Sonidos -->
    <audio id="snd-voltear" src="sonidos/voltear.mp3" preload="auto"></audio>
    <audio id="snd-acierto" src="sonidos/acierto.mp3" preload="auto"></audio>

        <!-- 💡 UN SOLO LLAMADO LIMPIO AL SCRIPT PRINCIPAL -->
    <script src="script_v2.js?v=2.1"></script>

    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker registrado con éxito', reg))
            .catch(err => console.warn('Error al registrar el Service Worker', err));
    }

// --- PARCHE DEFINITIVO PARA CERRAR EL ZOOM PICANDO AFUERA ---
        document.getElementById('zoomOverlay').addEventListener('click', function(evento) {
            if (evento.target === this) {
                this.style.display = 'none'; 
                this.classList.remove('active'); 
                this.classList.remove('show');   
            }
        });

    </script>
 <!-- 🧪 ESTE BOTÓN QUEDA INACTIVO POR SI LO NECESITO EN EL FUTURO:
<button onclick="juegoTerminado = true; alert('¡Modo galería activado! Toca cualquier carta')" style="position: fixed; top: 10px; left: 10px; z-index: 1000000; padding: 10px; background: red; color: white; border: none; border-radius: 5px; cursor: pointer;">
    🧪 Activar Galería (Prueba)
</button>
-->

    <!-- Pantalla de ampliación oculta por defecto -->
<div id="modal-ampliar" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 999999; justify-content: center; align-items: center; flex-direction: column;" onclick="this.style.display='none'">
    <span style="position: absolute; top: 20px; right: 30px; color: white; font-size: 2.5rem; cursor: pointer; font-family: sans-serif;">&times;</span>
    <img id="imagen-ampliada" src="" alt="Animal" style="max-width: 90%; max-height: 70%; border-radius: 15px; border: 4px white solid; box-shadow: 0 0 20px rgba(255,255,255,0.5);">
    <h3 id="nombre-ampliado" style="color: white; font-family: sans-serif; margin-top: 15px; font-size: 1.5rem; text-shadow: 2px 2px 4px black;"></h3>
</div>


</body>
</html>
